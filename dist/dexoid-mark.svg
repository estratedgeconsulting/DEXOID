<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 45 48" width="45" height="48" role="img" aria-label="Dexoid Technologies">
  <title>Dexoid Technologies</title>
  <!-- lit faces: top, then down the right -->
  <path fill="#D90000" d="M3 2 L32 2 L43 13 L43 34 L31 46 L31 13 L14 13 Z"/>
  <!-- shadowed faces: left, then along the bottom. Swap #0A0A0A for #FFFFFF
       when the mark sits on a dark ground. -->
  <path fill="#0A0A0A" d="M2 5 L13 16 L13 34 L2 46 Z"/>
  <path fill="#0A0A0A" d="M13 34 L29 34 L29 46 L2 46 Z"/>
  <!-- the fold between them: set to whatever the mark sits on -->
  <path stroke="#FFFFFF" stroke-width="0.7" d="M2 46 L13 34"/>
</svg>
